<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#131d2e" />
      <stop offset="100%" stop-color="#1c2a42" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f5e29f" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa821c" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(74, 158, 255, 0.45)" />
      <stop offset="100%" stop-color="rgba(10, 30, 60, 0.75)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky1)" />
  <!-- Stars / Dust -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="90" r="1.5" /><circle cx="240" cy="140" r="2" /><circle cx="450" cy="70" r="1" />
    <circle cx="850" cy="110" r="2" /><circle cx="1020" cy="80" r="1.5" /><circle cx="1110" cy="160" r="2" />
  </g>
  <!-- Pool Reflection Base -->
  <rect x="0" y="580" width="1200" height="220" fill="#05080e" />
  <rect x="180" y="600" width="840" height="120" rx="10" fill="#0d2238" stroke="#1e4976" stroke-width="2" />
  <rect x="200" y="610" width="800" height="100" rx="6" fill="#071828" />
  <!-- Luxury Mansion Architecture -->
  <g transform="translate(200, 140)">
    <!-- Main Stone & Concrete Volume -->
    <rect x="100" y="100" width="600" height="380" rx="8" fill="#111722" stroke="rgba(255,255,255,0.1)" stroke-width="2" />
    <rect x="80" y="60" width="440" height="160" rx="6" fill="#182232" stroke="rgba(212,175,55,0.4)" stroke-width="2" />
    <!-- Golden Canopy / Overhang -->
    <rect x="40" y="40" width="520" height="24" rx="4" fill="url(#goldGrad)" filter="url(#glow)" />
    <rect x="300" y="220" width="460" height="20" rx="4" fill="url(#goldGrad)" />
    <!-- Glass Living Room Floor to Ceiling -->
    <rect x="120" y="240" width="340" height="220" rx="4" fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <line x1="230" y1="240" x2="230" y2="460" stroke="#1e293b" stroke-width="3" />
    <line x1="340" y1="240" x2="340" y2="460" stroke="#1e293b" stroke-width="3" />
    <!-- Warm Interior Lighting -->
    <circle cx="230" cy="330" r="45" fill="#ffe29a" opacity="0.25" filter="url(#glow)" />
    <circle cx="380" cy="330" r="55" fill="#ffe29a" opacity="0.25" filter="url(#glow)" />
    <!-- Upper Floor Glass & Louvers -->
    <rect x="120" y="80" width="280" height="120" rx="4" fill="url(#glassGrad)" stroke="#38bdf8" stroke-width="1" />
    <g stroke="#d4af37" stroke-width="3" opacity="0.8">
      <line x1="420" y1="70" x2="420" y2="210" />
      <line x1="440" y1="70" x2="440" y2="210" />
      <line x1="460" y1="70" x2="460" y2="210" />
      <line x1="480" y1="70" x2="480" y2="210" />
    </g>
    <!-- Infinity Pool Water Glow -->
    <rect x="-20" y="470" width="840" height="16" fill="#00f0ff" opacity="0.6" filter="url(#glow)" />
  </g>
  <!-- Architectural Badge Overlay -->
  <rect x="60" y="640" width="1080" height="100" rx="12" fill="rgba(10, 14, 22, 0.92)" stroke="rgba(212,175,55,0.4)" stroke-width="1.5" />
  <text x="100" y="685" font-family="'Syne', sans-serif, Arial" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="1.5">RESIDENCIAL FRONTEIRA NOBRE</text>
  <text x="100" y="718" font-family="sans-serif, Arial" font-size="15" font-weight="700" fill="#d4af37" letter-spacing="3">CASAS INTELIGENTES • ALTO PADRÃO • PONTA PORÃ</text>
</svg>