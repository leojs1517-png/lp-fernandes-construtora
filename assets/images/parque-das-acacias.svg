<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051512" />
      <stop offset="50%" stop-color="#0b2b24" />
      <stop offset="100%" stop-color="#124439" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5eead4" />
      <stop offset="50%" stop-color="#00c896" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky2)" />
  <!-- Landscape Ground -->
  <rect x="0" y="560" width="1200" height="240" fill="#061a15" />
  <path d="M 0 580 Q 300 550, 600 580 T 1200 570 L 1200 800 L 0 800 Z" fill="#08261e" />
  <!-- Gated Community Homes -->
  <g transform="translate(180, 160)">
    <!-- Home 1 (Left) -->
    <polygon points="60,180 180,90 300,180" fill="#1b3a32" stroke="#00c896" stroke-width="2" />
    <rect x="70" y="180" width="220" height="240" fill="#10241f" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" rx="4" />
    <rect x="100" y="220" width="70" height="90" rx="4" fill="#99f6e4" opacity="0.85" />
    <rect x="200" y="220" width="70" height="90" rx="4" fill="#ffe29a" opacity="0.9" />
    <rect x="145" y="330" width="60" height="90" rx="2" fill="#00c896" />
    
    <!-- Home 2 (Right) -->
    <polygon points="480,180 600,90 720,180" fill="#1b3a32" stroke="#00c896" stroke-width="2" />
    <rect x="490" y="180" width="220" height="240" fill="#10241f" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" rx="4" />
    <rect x="520" y="220" width="70" height="90" rx="4" fill="#ffe29a" opacity="0.9" />
    <rect x="620" y="220" width="70" height="90" rx="4" fill="#99f6e4" opacity="0.85" />
    <rect x="565" y="330" width="60" height="90" rx="2" fill="#00c896" />

    <!-- Central Garden & Tree -->
    <circle cx="390" cy="270" r="65" fill="#059669" opacity="0.9" />
    <circle cx="370" cy="250" r="45" fill="#10b981" opacity="0.9" />
    <rect x="380" y="320" width="20" height="100" fill="#78350f" rx="3" />

    <!-- Community Pool & Leisure -->
    <ellipse cx="390" cy="440" rx="160" ry="35" fill="#06b6d4" stroke="#67e8f9" stroke-width="3" filter="url(#glowGreen)" />
  </g>
  <!-- Architectural Badge Overlay -->
  <rect x="60" y="640" width="1080" height="100" rx="12" fill="rgba(6, 22, 18, 0.94)" stroke="rgba(0,200,150,0.5)" stroke-width="1.5" />
  <text x="100" y="685" font-family="'Syne', sans-serif, Arial" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="1.5">PARQUE DAS ACÁCIAS</text>
  <text x="100" y="718" font-family="sans-serif, Arial" font-size="15" font-weight="700" fill="#00c896" letter-spacing="3">MINHA CASA MINHA VIDA PREMIUM • SUBSÍDIO CAIXA</text>
</svg>