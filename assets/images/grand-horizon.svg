<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="50%" stop-color="#161f36" />
      <stop offset="100%" stop-color="#223052" />
    </linearGradient>
    <linearGradient id="towerGlass" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.5)" />
      <stop offset="50%" stop-color="rgba(14, 165, 233, 0.2)" />
      <stop offset="100%" stop-color="rgba(2, 132, 199, 0.6)" />
    </linearGradient>
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sky3)" />
  <!-- City Horizon Base -->
  <rect x="0" y="600" width="1200" height="200" fill="#060810" />
  <!-- High Rise Tower -->
  <g transform="translate(380, 60)">
    <!-- Main Tower Structure -->
    <rect x="60" y="40" width="320" height="520" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
    <!-- Glass Curtain Façade -->
    <rect x="80" y="60" width="280" height="460" fill="url(#towerGlass)" stroke="rgba(255,255,255,0.2)" stroke-width="1" />
    <!-- Floor Levels Grid -->
    <g stroke="rgba(56,189,248,0.4)" stroke-width="1.5">
      <line x1="80" y1="100" x2="360" y2="100" /><line x1="80" y1="140" x2="360" y2="140" />
      <line x1="80" y1="180" x2="360" y2="180" /><line x1="80" y1="220" x2="360" y2="220" />
      <line x1="80" y1="260" x2="360" y2="260" /><line x1="80" y1="300" x2="360" y2="300" />
      <line x1="80" y1="340" x2="360" y2="340" /><line x1="80" y1="380" x2="360" y2="380" />
      <line x1="80" y1="420" x2="360" y2="420" /><line x1="80" y1="460" x2="360" y2="460" />
    </g>
    <!-- Balconies Floating -->
    <rect x="30" y="160" width="90" height="12" fill="#d4af37" filter="url(#blueGlow)" />
    <rect x="320" y="240" width="90" height="12" fill="#d4af37" filter="url(#blueGlow)" />
    <rect x="30" y="320" width="90" height="12" fill="#d4af37" filter="url(#blueGlow)" />
    <rect x="320" y="400" width="90" height="12" fill="#d4af37" filter="url(#blueGlow)" />
    <!-- Rooftop Crown Lounge & Pool -->
    <rect x="40" y="20" width="360" height="24" rx="4" fill="#d4af37" />
    <line x1="220" y1="0" x2="220" y2="20" stroke="#38bdf8" stroke-width="4" />
  </g>
  <!-- Architectural Badge Overlay -->
  <rect x="60" y="640" width="1080" height="100" rx="12" fill="rgba(10, 14, 24, 0.94)" stroke="rgba(56,189,248,0.5)" stroke-width="1.5" />
  <text x="100" y="685" font-family="'Syne', sans-serif, Arial" font-size="28" font-weight="800" fill="#ffffff" letter-spacing="1.5">EDIFÍCIO GRAND HORIZON</text>
  <text x="100" y="718" font-family="sans-serif, Arial" font-size="15" font-weight="700" fill="#38bdf8" letter-spacing="3">TORRE RESIDENCIAL PANORÂMICA • CENTRO DE PONTA PORÃ</text>
</svg>